<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compra Clara · SIMAN — presentación académica editable</title>
<script id="fbcfg" type="application/json">null</script>
<style>
@font-face{font-family:"RobotoV";src:url({{font}}) format("woff");font-weight:100 900;font-stretch:75% 100%}
:root{--ui:#161616;--ui2:#1f1f1f;--ui3:#2a2a2a;--line:#333;--tx:#eee;--mut:#9a9a9a;--acc:#D02D37;--acc2:#FF6B73}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ui);color:var(--tx);font-family:RobotoV,Roboto,Arial,sans-serif;font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
/* ---------- editor shell ---------- */
#app{display:grid;grid-template-rows:52px 1fr;grid-template-columns:230px 1fr 290px;height:100%}
#top{grid-column:1/-1;display:flex;align-items:center;gap:4px;padding:0 12px;background:#0d0d0d;border-bottom:1px solid var(--line)}
#top .brand{display:flex;align-items:center;gap:10px;margin-right:14px;font-weight:700;white-space:nowrap}
#top .brand img{height:16px}
.tb{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:8px;color:#ddd;white-space:nowrap}
.tb:hover{background:var(--ui3)}.tb svg{width:17px;height:17px}
.tb.pri{background:var(--acc);color:#fff;font-weight:700;padding:0 16px}.tb.pri:hover{background:#b8242d}
.sep{width:1px;height:24px;background:var(--line);margin:0 6px}
#status{color:var(--mut);font-size:12px;margin-left:auto;margin-right:10px;white-space:nowrap}
.menu{position:relative}
.menu .dd{position:absolute;top:40px;left:0;background:var(--ui2);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:200px;display:none;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu.open .dd{display:block}
.dd button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:6px}
.dd button:hover{background:var(--ui3)}.dd svg{width:16px;height:16px}
.icongrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:250px}
.icongrid button{justify-content:center;padding:8px}
/* slides list */
#left{background:var(--ui);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#left .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:var(--mut)}
#thumbs{overflow:auto;padding:4px 12px 20px;flex:1}
.th{position:relative;margin-bottom:12px;cursor:pointer;display:grid;grid-template-columns:20px 1fr;gap:6px;align-items:start}
.th .n{color:var(--mut);font-size:11px;padding-top:4px;text-align:right}
.th .box{width:180px;height:101.25px;border-radius:6px;overflow:hidden;position:relative;outline:2px solid transparent;background:#000}
.th.on .box{outline-color:var(--acc2)}
.th .box>.slide{transform:scale(.09375);transform-origin:0 0;pointer-events:none}
.th.drag-over .box{outline-color:#fff;outline-style:dashed}
/* canvas */
#mid{position:relative;overflow:hidden;background:#0b0b0b}
#cwrap{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.slide{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;color:#fff;font-family:RobotoV,Roboto,Arial,sans-serif}
.slide .bg{position:absolute;inset:0;overflow:hidden}
.slide .bg .fog{position:absolute;inset:-20%;filter:blur(90px)}
.slide .bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide.grain::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;mix-blend-mode:overlay;z-index:9000;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.el{position:absolute;transform-origin:center center}
.el .tx{width:100%;height:100%;outline:none;white-space:pre-wrap;word-wrap:break-word}
.el .tx b,.el .tx strong{font-weight:800}
.el img.im{width:100%;height:100%;display:block}
.el svg.sh{width:100%;height:100%;display:block;overflow:visible}
.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.ic{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ic svg{width:52%;height:52%}
.srch{width:100%;height:100%;display:flex;align-items:center;gap:.6em;padding:0 1.1em;border-radius:999px;font-weight:300}
.srch svg{width:1em;height:1em;flex:none}.srch .cr{display:inline-block;width:2px;height:1.1em;background:#FF6B73;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flip{width:100%;height:100%;perspective:1800px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;padding:40px;display:flex;flex-direction:column;overflow:hidden}
.flip .fb{transform:rotateY(180deg)}
.flip .fa .t1{font-weight:800;font-size:110px;line-height:1;color:#FF6B73}.flip .fa .t2{margin-top:auto;font-size:40px;font-weight:300;line-height:1.15}
.flip .fb .q{font-size:30px;font-weight:300;line-height:1.4}.flip .fb .s{margin-top:auto;font-size:20px;opacity:.75}
.ph{color:rgba(255,255,255,.45)}
/* selection */
#sel{position:absolute;pointer-events:none;z-index:9500}
.selbox{position:absolute;border:2px solid #FF6B73;pointer-events:none}
.hdl{position:absolute;width:16px;height:16px;background:#fff;border:2px solid #D02D37;border-radius:4px;pointer-events:auto}
.hdl.rot{border-radius:50%;cursor:grab}
.guide{position:absolute;background:#2fd6ff;pointer-events:none;z-index:9600}
.el.locked{cursor:default}
.editing{outline:2px dashed #FF6B73;outline-offset:6px;cursor:text}
/* right panel */
#right{background:var(--ui);border-left:1px solid var(--line);overflow:auto;padding:14px 14px 40px}
#right h3{font-size:12px;color:var(--mut);font-weight:500;margin:16px 0 8px}
#right h3:first-child{margin-top:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row.three{grid-template-columns:1fr 1fr 1fr}
.row.one{grid-template-columns:1fr}
.fld{display:flex;flex-direction:column;gap:4px}
.fld span{font-size:11px;color:var(--mut)}
.fld input,.fld select,.fld textarea{background:var(--ui2);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;min-width:0}
.fld textarea{min-height:80px;resize:vertical;line-height:1.4}
.fld input[type=range]{padding:0}
.fld input[type=color]{height:32px;padding:2px}
.sw{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.sw button{width:22px;height:22px;border-radius:50%;border:1px solid #555}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.btns button{background:var(--ui2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:inline-flex;align-items:center;gap:6px}
.btns button:hover{background:var(--ui3)}
.btns button[aria-pressed=true]{background:var(--acc);border-color:var(--acc)}
.btns svg{width:15px;height:15px}
.hint{color:var(--mut);font-size:12px;line-height:1.5;margin-top:10px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0}
/* present */
#pres{position:fixed;inset:0;background:#000;z-index:100;display:none}
#pres.on{display:block}
#pstage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center}
#pstage .slide{transition:opacity .6s ease;opacity:0}
#pstage .slide.on{opacity:1}
#pbar{position:absolute;left:0;top:0;height:3px;background:#FF6B73;transition:width .4s;z-index:5}
#pui{position:absolute;right:16px;bottom:14px;display:flex;gap:6px;opacity:0;transition:opacity .3s;z-index:5}
#pres:hover #pui{opacity:1}
#pui button{background:rgba(0,0,0,.6);color:#fff;border-radius:30px;padding:8px 12px;display:flex;gap:6px;align-items:center;font-size:12px}
#pui svg{width:15px;height:15px}
#pnotes{position:absolute;left:16px;bottom:16px;width:520px;max-height:40vh;overflow:auto;background:rgba(20,20,20,.94);border:1px solid #333;border-radius:14px;padding:16px 18px;font-size:15px;line-height:1.5;display:none;z-index:6}
#pnotes.on{display:block}#pnotes b{color:#FF6B73;display:block;margin-bottom:4px;font-size:12px}
#pov{position:absolute;inset:0;background:rgba(0,0,0,.92);z-index:7;display:none;overflow:auto;padding:30px;grid-template-columns:repeat(4,1fr);gap:16px;align-content:start}
#pov.on{display:grid}
#pov button{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#111;text-align:left}
#pov button .slide{transform:scale(var(--k));transform-origin:0 0;pointer-events:none}
#pov button span{position:absolute;left:8px;bottom:6px;background:rgba(0,0,0,.7);padding:2px 8px;border-radius:10px;font-size:12px}
/* animations (present) */
.a-fade{animation:aFade .8s both}.a-up{animation:aUp .9s cubic-bezier(.2,.7,.2,1) both}.a-zoom{animation:aZoom .9s cubic-bezier(.2,.7,.2,1) both}.a-blur{animation:aBlur 1s both}.a-left{animation:aLeft .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes aFade{from{opacity:0}}@keyframes aUp{from{opacity:0;translate:0 50px}}@keyframes aZoom{from{opacity:0;scale:.92}}@keyframes aBlur{from{opacity:0;filter:blur(24px)}}@keyframes aLeft{from{opacity:0;translate:-60px 0}}
@media (prefers-reduced-motion:reduce){.a-fade,.a-up,.a-zoom,.a-blur,.a-left{animation:none}#pstage .slide{transition:none}.flip .in{transition:none}}
#gate{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(12,2,3,.92);text-align:center}#gate[hidden]{display:none}#gate .box{max-width:520px;padding:32px}#gate h2{font-weight:800;font-size:28px;margin:0 0 12px}#gate p{color:var(--mut);line-height:1.5}#gate button{margin-top:18px;background:#D02D37;color:#fff;border:0;border-radius:100px;padding:12px 22px;font:600 15px Roboto,sans-serif;cursor:pointer}#gate button[hidden],#setup[hidden]{display:none}#gate textarea{width:100%;background:#1a0a0b;color:#fff;border:1px solid #5a2a2d;border-radius:12px;padding:12px;font:13px/1.4 monospace;margin-top:14px}#gate .ghost{background:transparent;border:1px solid #777}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;border:1px solid #444;padding:10px 16px;border-radius:10px;display:none;z-index:200}
input[type=file]{display:none}
</style></head><body>
<div id="app">
  <div id="top">
    <div class="brand"><img src="{{logoW}}" alt="siman.com"><span>Compra Clara · proyecto académico</span></div>
    <button class="tb" id="bUndo" title="Deshacer (Ctrl+Z)">{{ic:undo}}</button>
    <button class="tb" id="bRedo" title="Rehacer (Ctrl+Shift+Z)">{{ic:redo}}</button>
    <span class="sep"></span>
    <button class="tb" id="bText">{{ic:type}} Texto</button>
    <button class="tb" id="bImg">{{ic:image}} Imagen</button>
    <div class="menu" id="mShape"><button class="tb">{{ic:shapes}} Forma</button><div class="dd">
      <button data-shape="rombo">{{ic:diamond}} Rombo</button><button data-shape="rombo-borde">{{ic:diamond}} Rombo con borde</button><button data-shape="rect">{{ic:square}} Rectángulo</button><button data-shape="circle">{{ic:circle}} Círculo</button><button data-shape="line">{{ic:minus}} Línea</button><button data-shape="glass">{{ic:panel}} Tarjeta de cristal</button></div></div>
    <div class="menu" id="mIcon"><button class="tb">{{ic:star}} Ícono</button><div class="dd"><div class="icongrid" id="icgrid"></div></div></div>
    <div class="menu" id="mWid"><button class="tb">{{ic:sparkles}} Interactivo</button><div class="dd">
      <button data-w="search">{{ic:search}} Buscador que escribe solo</button><button data-w="flip">{{ic:repeat}} Tarjeta que gira</button><button data-w="counter">{{ic:hash}} Contador animado</button><button data-w="logoW">{{ic:image}} Logo siman.com blanco</button><button data-w="iso">{{ic:diamond}} Isotipo SIMAN</button></div></div>
    <span class="sep"></span>
    <div class="menu" id="mFile"><button class="tb">{{ic:save}} Respaldo</button><div class="dd">
      <button id="bExpJson">{{ic:download}} Descargar respaldo (.json)</button>
      <button id="bImpJson">{{ic:upload}} Restaurar un respaldo (.json)</button></div></div>
    <span id="status">Conectando…</span>
    <button class="tb pri" id="bPresent">{{ic:play}} Presentar</button>
  </div>
  <aside id="left"><div class="hd"><span>Láminas</span><div class="menu" id="mNew"><button class="tb" title="Nueva lámina">{{ic:plus}} Nueva</button><div class="dd" style="left:auto;right:0">
    <button data-l="portada">Portada</button><button data-l="frase">Frase grande</button><button data-l="titulo">Título y texto</button><button data-l="dato">Dato grande</button><button data-l="tres">Tres tarjetas</button><button data-l="captura">Captura y texto</button><button data-l="blanco">En blanco</button></div></div></div><div id="thumbs"></div></aside>
  <main id="mid"><div id="cwrap"></div></main>
  <aside id="right"></aside>
</div>
<div id="pres"><div id="pbar"></div><div id="pstage"></div><div id="pnotes"></div><div id="pov"></div>
  <div id="pui"><button id="pPrev">{{ic:left}}</button><button id="pOv">{{ic:grid}} Índice (O)</button><button id="pNo">{{ic:notes}} Notas (N)</button><button id="pFs">{{ic:full}} Pantalla completa (F)</button><button id="pNext">{{ic:right}}</button><button id="pExit">{{ic:x}} Salir (Esc)</button></div></div>
<input type="file" id="fImg" accept="image/*"><input type="file" id="fBg" accept="image/*"><input type="file" id="fJson" accept="application/json,.json">
<div id="toast"></div>
<div id="gate"><div class="box"><h2 id="gT">Cargando la presentación…</h2><p id="gP">Conectando con la versión compartida del grupo.</p><button id="gB" hidden>Cargar la presentación base de Compra Clara</button>
<div id="setup" hidden><textarea id="cfgIn" rows="9" placeholder="Pega aquí el bloque const firebaseConfig = { … } que te da Firebase"></textarea><br><button id="cfgTest">Probar conexión</button> <button id="cfgLocal" class="ghost">Probar sin base de datos</button><p id="cfgMsg"></p><button id="cfgDl" hidden>Descargar index.html listo para publicar</button></div></div></div>
<script id="seed" type="application/json">{{seed}}</script>
<script>
const SRC = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const IC = {{icons}};
const ASSETS0 = {{assets}};
const W = 1920, H = 1080;
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SW = ['#FFFFFF','#FF6B73','#D02D37','#A83338','#8E0F14','#5A0A0E','#1F1F1F','#120405','#F1F1F2','#FEEDEE','#F2F8FB','#316C0C'];
const FOGS = {
  portada:'radial-gradient(40% 50% at 30% 45%,#E0283A,transparent 70%),radial-gradient(35% 45% at 72% 60%,#8E0F14,transparent 70%),radial-gradient(30% 30% at 55% 25%,#FF7A8A,transparent 70%)',
  derecha:'radial-gradient(45% 55% at 75% 50%,#C21E2B,transparent 70%),radial-gradient(30% 40% at 20% 85%,#5A0A0E,transparent 70%)',
  izquierda:'radial-gradient(45% 55% at 22% 50%,#C21E2B,transparent 70%),radial-gradient(30% 40% at 85% 15%,#5A0A0E,transparent 70%)',
  centro:'radial-gradient(35% 45% at 50% 55%,#B5151B,transparent 70%)',
  abajo:'radial-gradient(60% 40% at 50% 100%,#C21E2B,transparent 70%),radial-gradient(30% 30% at 15% 15%,#5A0A0E,transparent 70%)',
  arriba:'radial-gradient(60% 45% at 60% 0%,#C21E2B,transparent 70%),radial-gradient(30% 35% at 10% 90%,#5A0A0E,transparent 70%)',
  rosa:'radial-gradient(40% 50% at 70% 40%,#FF7A8A,transparent 70%),radial-gradient(45% 55% at 25% 70%,#D02D37,transparent 70%)',
  ninguna:'none' };
const ANIMS = {none:'Ninguna', fade:'Aparecer', up:'Subir', left:'Desde la izquierda', zoom:'Acercar', blur:'Desenfoque'};

/* =================== builders (también usados por las plantillas) =================== */
const E = {
  text:(html,x,y,w,h,o={}) => ({id:uid(),type:'text',x,y,w,h,rot:0,op:1,anim:o.anim||'up',lock:false,p:Object.assign({html,size:28,weight:300,stretch:100,lh:1.35,ls:0,color:'#FFFFFF',align:'left',upper:false,italic:false},o)}),
  img:(src,x,y,w,h,o={}) => ({id:uid(),type:'image',x,y,w,h,rot:0,op:1,anim:o.anim||'fade',lock:false,p:Object.assign({src,fit:'cover',radius:0,glow:false,tilt:0,shadow:false},o)}),
  shape:(kind,x,y,w,h,o={}) => ({id:uid(),type:'shape',x,y,w,h,rot:0,op:1,anim:o.anim||'none',lock:false,p:Object.assign({kind,fill:'#D02D37',stroke:'#FFFFFF',sw:0,radius:28},o)}),
  icon:(name,x,y,s,o={}) => ({id:uid(),type:'icon',x,y,w:s,h:s,rot:0,op:1,anim:o.anim||'fade',lock:false,p:Object.assign({name,color:'#FFFFFF',bg:'#A83338'},o)}),
  search:(text,x,y,w,h,o={}) => ({id:uid(),type:'search',x,y,w,h,rot:0,op:1,anim:o.anim||'fade',lock:false,p:Object.assign({text,size:40},o)}),
  flip:(t1,t2,q,s,x,y,w,h,o={}) => ({id:uid(),type:'flip',x,y,w,h,rot:0,op:1,anim:o.anim||'up',lock:false,p:Object.assign({t1,t2,q,s,back:'#A83338'},o)}),
  counter:(value,x,y,w,h,o={}) => ({id:uid(),type:'counter',x,y,w,h,rot:0,op:1,anim:o.anim||'fade',lock:false,p:Object.assign({value,dec:0,pre:'',suf:'',size:200,weight:800,stretch:100,color:'#FFFFFF',align:'left'},o)}),
};
const S = (title, fog, els, notes='', o={}) => ({id:uid(), title, bg:{color:o.color||'#120405', fog, img:null, grain:true}, notes, els});
const PH = t => `<span class="ph">[${t}]</span>`;
function chrome(label){ return [ E.img('asset:logoW',100,80,300,34,{fit:'contain',anim:'none'}), E.text(label,1220,78,600,40,{size:22,align:'right',anim:'none',lh:1.2}) ]; }
function glassCard(x,y,w,h,o={}){ return E.shape('glass',x,y,w,h,Object.assign({radius:28,anim:'up'},o)); }

function LAYOUT(kind){
  switch(kind){
    case 'portada': return S('Portada','portada',[E.img('asset:logoW',100,80,300,34,{fit:'contain',anim:'none'}),E.text('Subtítulo',100,340,1400,60,{size:34}),E.text('Título<br><b>de la lámina</b>',100,420,1500,420,{size:190,lh:1.02,ls:-2,anim:'blur'}),E.shape('rombo-borde',1680,860,130,130,{fill:'none',stroke:'#FFFFFF',sw:2})]);
    case 'frase': return S('Frase grande','centro',[...chrome('Sección'),E.text('Una frase que<br><b>se quede en la memoria.</b>',100,330,1720,420,{size:130,lh:1.05,ls:-2,anim:'blur'})]);
    case 'titulo': return S('Título y texto','derecha',[...chrome('Sección'),E.text('Título <b>de la lámina</b>',100,240,1300,240,{size:110,lh:1.02,ls:-2}),E.text('Texto de apoyo. Escribe aquí la idea en dos o tres líneas.',104,560,900,200,{size:30})]);
    case 'dato': return S('Dato grande','centro',[...chrome('Sección'),E.counter(3,0,230,1920,400,{align:'center',size:420}),E.text('descripción <b>del dato</b>',260,650,1400,80,{size:46,align:'center'})]);
    case 'tres': { const s=S('Tres tarjetas','abajo',[...chrome('Sección'),E.text('Título <b>de la lámina</b>',100,200,1500,150,{size:96,lh:1.02,ls:-2})]); [0,1,2].forEach(i=>{ const x=100+i*590; s.els.push(glassCard(x,440,560,500),E.icon('idea',x+44,484,96),E.text('Título<br><b>de tarjeta</b>',x+44,620,470,130,{size:44,lh:1.05}),E.text('Texto breve de la tarjeta.',x+44,790,470,120,{size:24})); }); return s; }
    case 'captura': return S('Captura y texto','derecha',[...chrome('Sección'),E.text('Título<br><b>de la lámina.</b>',100,330,800,320,{size:110,lh:1.02,ls:-2}),E.text('Texto de apoyo.',104,700,740,160,{size:28}),E.img('asset:02-escritorio-busqueda-reembolso',980,220,980,612,{radius:28,glow:true,tilt:-14})]);
    default: return S('En blanco','ninguna',[]);
  }
}

/* =================== mazo inicial: Compra Clara en estilo «Atmósfera roja» =================== */
function DEFAULT_DECK(){
  const s = [];

function setPath(o, path, v){ const ks = path.split('.'); let t = o; ks.slice(0,-1).forEach(k => t = t[k]); t[ks.at(-1)] = v; }

let cT; const commitSoon = () => { clearTimeout(cT); cT = setTimeout(commit, 400); };
function rerenderEl(e){ const d = $(`#canvas .el[data-id="${e.id}"]`); if (d) d.replaceWith(renderEl(e,'edit')); drawSel(); }
function alignSel(k){ const els = selIds.map(elById); els.forEach(e => { if (k==='l') e.x = 100; if (k==='r') e.x = W-100-e.w; if (k==='c') e.x = Math.round((W-e.w)/2); if (k==='t') e.y = 80; if (k==='b') e.y = H-80-e.h; if (k==='m') e.y = Math.round((H-e.h)/2); }); renderCanvas(); commit(); renderPanel(); }

function renderThumbs(){
  const T = $('#thumbs'); T.innerHTML = '';
  deck.slides.forEach((sl,i) => { const d = document.createElement('div'); d.className = 'th' + (i===cur?' on':''); d.draggable = true; d.dataset.i = i;
    d.innerHTML = `<span class="n">${i+1}</span><div class="box" title="${esc(sl.title)}"></div>`; $('.box', d).appendChild(renderSlide(sl, 'thumb'));
    d.onclick = () => goSlide(i);
    d.ondragstart = ev => { ev.dataTransfer.setData('text/x-slide', i); };
    d.ondragover = ev => { if (ev.dataTransfer.types.includes('text/x-slide')){ ev.preventDefault(); d.classList.add('drag-over'); } };
    d.ondragleave = () => d.classList.remove('drag-over');
    d.ondrop = ev => { ev.preventDefault(); d.classList.remove('drag-over'); const from = +ev.dataTransfer.getData('text/x-slide'); moveSlide(from, i); };
    T.appendChild(d); });
}
let thT; function renderThumb(i){ clearTimeout(thT); thT = setTimeout(() => { const box = $(`#thumbs .th[data-i="${i}"] .box`); if (!box) return renderThumbs(); box.innerHTML = ''; box.appendChild(renderSlide(deck.slides[i], 'thumb')); }, 250); }
function goSlide(i){ if (editingId) stopEdit(); cur = i; selIds = []; renderCanvas(); renderPanel(); $$('#thumbs .th').forEach((t,j)=>t.classList.toggle('on', j===cur)); $(`#thumbs .th[data-i="${i}"]`)?.scrollIntoView({block:'nearest'}); }
function moveSlide(a,b){ if (b<0||b>=deck.slides.length||a===b) return; const [s] = deck.slides.splice(a,1); deck.slides.splice(b,0,s); cur = b; renderThumbs(); goSlide(b); commit(); }
function dupSlide(){ const c = clone(S_()); c.id = uid(); c.els.forEach(e => e.id = uid()); c.title += ' (copia)'; deck.slides.splice(cur+1,0,c); renderThumbs(); goSlide(cur+1); commit(); }
function delSlide(){ if (deck.slides.length <= 1) return toast('La presentación necesita al menos una lámina'); deck.slides.splice(cur,1); fixCur(); renderThumbs(); goSlide(cur); commit(); toast('Lámina eliminada · Ctrl+Z para deshacer'); }

let replaceImg = null;
function readImage(file, max=2000, jpg=false){ return new Promise(res => { const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const sc = Math.min(1, max/Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc); c.getContext('2d').drawImage(im,0,0,c.width,c.height); const png = !jpg && (file.type === 'image/png' || file.type === 'image/svg+xml'); res({ data: c.toDataURL(png?'image/png':'image/jpeg', jpg ? .72 : .86), w:c.width, h:c.height }); }; im.src = fr.result; }; fr.readAsDataURL(file); }); }
async function storeImage(file){
  if (ASSETS){ try { const r = await readImage(file); const blob = await (await fetch(r.data)).blob(); const up = await ASSETS.upload(blob); return { src: up.url, w: r.w, h: r.h }; } catch(e){ toast('No se pudo subir la imagen'); return null; } }
  const r = await readImage(file, shared ? 1400 : 2000, shared); if (shared && r.data.length > 450000){ toast('Imagen muy pesada para guardarla compartida'); return null; }
  if (shared) return { src: r.data, w: r.w, h: r.h };
  const key = 'img_'+uid(); deck.assets[key] = r.data; return { src: 'asset:'+key, w: r.w, h: r.h };
}
async function addImageFile(file, at){
  if (!canWrite) return toast('Solo lectura');
  setStatus('Subiendo imagen…'); const r = await storeImage(file); if (!r) { setStatus(''); return; }
  if (replaceImg){ const e = elById(replaceImg); if (e){ e.p.src = r.src; rerenderEl(e); commit(); } replaceImg = null; return; }
  const w = Math.min(900, r.w), h = Math.round(w * r.h / r.w);
  addEl(E.img(r.src, at ? Math.round(at.x - w/2) : Math.round((W-w)/2), at ? Math.round(at.y - h/2) : Math.round((H-h)/2), w, h, {radius:20}));
}
$('#fImg').onchange = ev => { const f = ev.target.files[0]; if (f) addImageFile(f); ev.target.value = ''; };
$('#fBg').onchange = async ev => { const f = ev.target.files[0]; ev.target.value = ''; if (!f || !canWrite) return; const r = await storeImage(f); if (!r) return; S_().bg.img = r.src; renderCanvas(); commit(); renderPanel(); };

document.addEventListener('keydown', ev => {
  if ($('#pres').classList.contains('on')) return;
  const typing = editingId || ev.target.closest('input,textarea,select');
  const mod = ev.ctrlKey || ev.metaKey;
  if (mod && ev.key.toLowerCase() === 'z' && !typing){ ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if (mod && ev.key.toLowerCase() === 'y' && !typing){ ev.preventDefault(); redo(); return; }
  if (ev.key === 'Escape'){ if (editingId) stopEdit(); selIds = []; drawSel(); renderPanel(); return; }
  if (typing) return;
  if (mod && ev.key.toLowerCase() === 'd'){ ev.preventDefault(); if (selIds.length) dupSel(); return; }
  if (mod && ev.key.toLowerCase() === 'c' && selIds.length){ clip = selIds.map(id => clone(elById(id))); toast('Copiado'); return; }
  if (mod && ev.key.toLowerCase() === 'a'){ ev.preventDefault(); selIds = S_().els.map(e=>e.id); drawSel(); renderPanel(); return; }
  if ((ev.key === 'Delete' || ev.key === 'Backspace') && selIds.length){ ev.preventDefault(); delSel(); return; }
  if (ev.key.startsWith('Arrow') && selIds.length){ ev.preventDefault(); const d = ev.shiftKey ? 10 : 1; selIds.forEach(id => { const e = elById(id); if (e.lock) return; if (ev.key==='ArrowLeft') e.x -= d; if (ev.key==='ArrowRight') e.x += d; if (ev.key==='ArrowUp') e.y -= d; if (ev.key==='ArrowDown') e.y += d; posEl(e); }); drawSel(); commitSoon(); return; }
  if (ev.key === 'Enter' && selIds.length === 1){ const e = elById(selIds[0]); if (e.type === 'text'){ ev.preventDefault(); startEdit(e, $(`#canvas .el[data-id="${e.id}"]`)); } }
  if (!selIds.length && (ev.key === 'PageDown')) goSlide(Math.min(deck.slides.length-1, cur+1));
  if (!selIds.length && (ev.key === 'PageUp')) goSlide(Math.max(0, cur-1));
});
function pasteEls(){ const s = S_(); selIds = clip.map(c => { const n = clone(c); n.id = uid(); n.x += 30; n.y += 30; s.els.push(n); return n.id; }); renderCanvas(); commit(); renderPanel(); }

/* =================== modo presentación =================== */
let pc = 0, typers = [];
const P = $('#pres'), PS = $('#pstage');
function fitP(){ const k = Math.min(innerWidth/W, innerHeight/H); PS.style.transform = `translate(-50%,-50%) scale(${k})`; }
addEventListener('resize', fitP);
function present(start){ if (editingId) stopEdit(); pc = start ?? cur; P.classList.add('on'); fitP(); showP(pc); try { document.documentElement.requestFullscreen?.().catch(()=>{}); } catch(e){} }
function exitP(){ P.classList.remove('on'); typers.forEach(clearInterval); if (document.fullscreenElement) document.exitFullscreen(); goSlide(Math.min(pc, deck.slides.length-1)); }
function showP(i){
  pc = Math.max(0, Math.min(deck.slides.length-1, i)); typers.forEach(clearInterval); typers = [];
  const sl = deck.slides[pc]; const r = renderSlide(sl, 'present'); PS.innerHTML = ''; PS.appendChild(r);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let k = 0;
  sl.els.forEach(e => { const d = $(`.el[data-id="${e.id}"]`, r); if (!d) return;
    if (e.anim && e.anim !== 'none' && !reduce){ const inner = d.firstElementChild; d.classList.add('a-'+e.anim); d.style.animationDelay = (0.1 + Math.min(k,10)*0.08)+'s'; k++; }
    if (e.type === 'search'){ const st = $('.st', d); const full = e.p.text; let n = 0; if (reduce) st.textContent = full; else { const t = setTimeout(() => { const iv = setInterval(() => { st.textContent = full.slice(0, ++n); if (n >= full.length) clearInterval(iv); }, 55); typers.push(iv); }, 500); typers.push(t); } }
    if (e.type === 'counter'){ const tx = $('.tx', d), p = e.p; if (reduce) return; const t0 = performance.now() + 300; const step = now => { const q = Math.min(1, Math.max(0,(now - t0)/1100)), z = 1 - Math.pow(1-q, 3); tx.textContent = fmtNum(p.value*z, p); if (q < 1) requestAnimationFrame(step); }; tx.textContent = fmtNum(0,p); requestAnimationFrame(step); }
    if (e.type === 'flip'){ d.addEventListener('click', ev => { ev.stopPropagation(); $('.flip', d).classList.toggle('open'); }); }
  });
  requestAnimationFrame(() => r.classList.add('on'));
  $('#pbar').style.width = ((pc+1)/deck.slides.length*100)+'%';
  $('#pnotes').innerHTML = `<b>${pc+1} · ${esc(sl.title)}</b>${esc(sl.notes||'Sin notas para esta lámina.')}`;
}
$('#bPresent').onclick = () => present();
$('#pPrev').onclick = ev => { ev.stopPropagation(); showP(pc-1); }; $('#pNext').onclick = ev => { ev.stopPropagation(); showP(pc+1); };
$('#pExit').onclick = ev => { ev.stopPropagation(); exitP(); };
$('#pNo').onclick = ev => { ev.stopPropagation(); $('#pnotes').classList.toggle('on'); };
$('#pFs').onclick = ev => { ev.stopPropagation(); document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); };
$('#pOv').onclick = ev => { ev.stopPropagation(); toggleOv(); };
function toggleOv(){ const o = $('#pov'); if (o.classList.toggle('on')){ o.innerHTML = ''; const kw = (o.clientWidth - 60 - 48)/4; deck.slides.forEach((sl,i) => { const b = document.createElement('button'); b.style.setProperty('--k', kw/W); const r = renderSlide(sl,'thumb'); b.appendChild(r); b.insertAdjacentHTML('beforeend', `<span>${i+1} · ${esc(sl.title)}</span>`); b.onclick = ev => { ev.stopPropagation(); o.classList.remove('on'); showP(i); }; o.appendChild(b); }); } }
P.addEventListener('click', ev => { if (ev.target.closest('#pui,#pnotes,#pov')) return; showP(pc+1); });
document.addEventListener('keydown', ev => { if (!P.classList.contains('on')) return;
  if (['ArrowRight','PageDown',' ','Enter'].includes(ev.key)){ ev.preventDefault(); showP(pc+1); }
  else if (['ArrowLeft','PageUp','Backspace'].includes(ev.key)){ ev.preventDefault(); showP(pc-1); }
  else if (ev.key==='Home') showP(0); else if (ev.key==='End') showP(deck.slides.length-1);
  else if (ev.key==='n'||ev.key==='N') $('#pnotes').classList.toggle('on');
  else if (ev.key==='o'||ev.key==='O') toggleOv();
  else if (ev.key==='f'||ev.key==='F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  else if (ev.key==='Escape'){ if ($('#pov').classList.contains('on')) $('#pov').classList.remove('on'); else exitP(); } });
let tx0 = null; P.addEventListener('touchstart', e => tx0 = e.touches[0].clientX); P.addEventListener('touchend', e => { if (tx0 === null) return; const d = e.changedTouches[0].clientX - tx0; if (Math.abs(d) > 60) showP(pc + (d<0?1:-1)); tx0 = null; });
document.addEventListener('fullscreenchange', () => setTimeout(fitP, 50));

/* =================== inicio =================== */
function renderAll(){ renderThumbs(); renderCanvas(); renderPanel(); }
const gate = (title, text, btn) => { $('#gate').hidden = !title; if (!title) return; $('#gT').textContent = title; $('#gP').textContent = text; $('#gB').hidden = !btn; };
function startDeck(d){ deck = d; deck.assets = Object.assign({}, ASSETS0, deck.assets||{}); hist = [JSON.stringify(deck.slides)]; hIdx = 0; fitCanvas(); renderAll(); gate(); if (/presentar/.test(location.hash)) present(0); }
async function localMode(){
  shared = false; const seed = DEFAULT_DECK(); const stored = await dbGet('deck:'+seed.docId);
  startDeck(stored && stored.updated > 0 ? stored : seed); setStatus('Modo local: los cambios quedan solo en este navegador');
}
const FBV = 'https://www.gstatic.com/firebasejs/10.12.2/';
const ROOT = 'decks/compra-clara';
async function fireDB(cfg){
  const A = await import(FBV+'firebase-app.js'), F = await import(FBV+'firebase-firestore.js');
  const app = A.getApps().length ? A.getApp() : A.initializeApp(cfg); const fs = F.getFirestore(app);
  const mapP = p => p === 'deck/meta' ? ROOT : ROOT + '/' + p;
  const code = e => ({'permission-denied':'invalid_argument','resource-exhausted':'quota_exceeded','invalid-argument':'invalid_argument'}[e && e.code] || 'unavailable');
  const wrap = s => ({ id: s.id, exists: s.exists(), data: () => s.exists() ? JSON.parse(s.data().j) : undefined });
  return {
    doc: p => ({
      set: async d => { try { await F.setDoc(F.doc(fs, mapP(p)), { j: JSON.stringify(d), t: Date.now() }); } catch(e){ throw { code: code(e), message: String(e && e.message) }; } },
      get: async () => wrap(await F.getDoc(F.doc(fs, mapP(p)))),
      onSnapshot: (n, er) => F.onSnapshot(F.doc(fs, mapP(p)), s => n(wrap(s)), e => er && er({ code: code(e) })) }),
    collection: p => ({ onSnapshot: (n, er) => F.onSnapshot(F.collection(fs, mapP(p)), q => n({ docChanges: () => q.docChanges().map(c => ({ type: c.type, doc: wrap(c.doc) })) }), e => er && er({ code: code(e) })) })
  };
}
function parseCfg(txt){ const o = {}; txt.replace(/(\w+)\s*:\s*["']([^"']+)["']/g, (m,k,v) => { o[k] = v; }); return (o.apiKey && o.projectId) ? o : null; }
function setupMode(){
  gate('Conecta la base de datos compartida', 'Pega la configuración de tu proyecto de Firebase. Solo se hace una vez: luego descargas el archivo listo y lo publicas.', false);
  $('#setup').hidden = false; let ok = null;
  $('#cfgLocal').onclick = () => { $('#setup').hidden = true; localMode(); };
  $('#cfgTest').onclick = async () => {
    const cfg = parseCfg($('#cfgIn').value); const msg = $('#cfgMsg'); $('#cfgDl').hidden = true;
    if (!cfg){ msg.textContent = 'No encontré apiKey y projectId en lo que pegaste. Copia el bloque completo de firebaseConfig.'; return; }
    msg.textContent = 'Probando…';
    try { const d = await fireDB(cfg); await Promise.race([d.doc('deck/meta').get(), new Promise((_,r) => setTimeout(() => r({code:'timeout'}), 10000))]); ok = cfg; msg.textContent = 'Conexión correcta. Descarga el archivo y publícalo.'; $('#cfgDl').hidden = false; }
    catch(e){ msg.textContent = (e && e.code === 'permission-denied') ? 'Firebase responde, pero las reglas no permiten leer. Publica las reglas de la guía.' : 'No se pudo conectar. Revisa la configuración y que Firestore esté creado.'; }
  };
  $('#cfgDl').onclick = () => { const html = SRC.replace(/(<script id="fbcfg" type="application\/json">)[\s\S]*?(<\/script>)/, (m,a,b) => a + JSON.stringify(ok).replace(/</g,'\\u003c') + b); download('index.html', html, 'text/html'); };
}
(async () => {
  fitCanvas();
  const cfg = JSON.parse($('#fbcfg').textContent || 'null');
  if (!cfg) return setupMode();
  let db; try { db = await fireDB(cfg); } catch(e){ gate('No se pudo cargar Firebase', 'Revisa tu conexión a internet y vuelve a abrir la página.', false); return; }
  SDB = db; shared = true;
  let gotMeta = false, gotSlides = false, metaExists = false, started = false;
  const timer = setTimeout(() => { if (!started) gate('No se pudo conectar todavía', 'La versión compartida no responde. Revisa tu conexión; la página sigue intentándolo.', false); }, 10000);
  const ready = () => {
    if (!gotMeta || !gotSlides) return;
    clearTimeout(timer);
    if (!metaExists){ if (!started) gate('La presentación compartida está vacía', canWrite ? 'Cárgala una sola vez y todo el grupo verá y editará la misma versión.' : 'Quien tenga acceso de Editor debe cargarla primero.', canWrite); return; }
    if (!started){ started = true; applyRemote(); if (deck){ startDeck(deck); setStatus(canWrite ? 'Guardado · compartido con el grupo' : 'Solo lectura'); } }
    else applyRemote();
  };
  db.doc('deck/meta').onSnapshot(s => { gotMeta = true; metaExists = s.exists; if (s.exists){ const o = (s.data().order || []).slice(); order = o; orderSynced = JSON.stringify(o); } ready(); }, e => { clearTimeout(timer); if (!started) gate('Sin acceso a la base de datos', 'Firestore rechazó la lectura. Revisa que las reglas estén publicadas tal como dice la guía.', false); });
  db.collection('slides').onSnapshot(q => { gotSlides = true; q.docChanges().forEach(ch => { const id = ch.doc.id; if (ch.type === 'removed'){ delete remote[id]; delete synced[id]; return; } const b = JSON.stringify(ch.doc.data()); if (synced[id] !== b){ remote[id] = b; synced[id] = b; } }); ready(); }, e => { clearTimeout(timer); });
  $('#gB').onclick = async () => { $('#gB').hidden = true; $('#gP').textContent = 'Cargando las 21 láminas…'; deck = DEFAULT_DECK(); started = true; startDeck(deck); await flush(); };
})();
</script>
