:root{--ui:#161616;--ui2:#1f1f1f;--ui3:#2a2a2a;--line:#333;--tx:#eee;--mut:#9a9a9a;--acc:#D02D37;--acc2:#FF6B73}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ui);color:var(--tx);font-family:RobotoV,Roboto,Arial,sans-serif;font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
/* ---------- editor shell ---------- */
#app{display:grid;grid-template-rows:52px 1fr;grid-template-columns:230px 1fr 290px;height:100%}
#top{grid-column:1/-1;display:flex;align-items:center;gap:4px;padding:0 12px;background:#0d0d0d;border-bottom:1px solid var(--line)}
#top .brand{display:flex;align-items:center;gap:10px;margin-right:14px;font-weight:700;white-space:nowrap}
#top .brand img{height:16px}
.tb{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:8px;color:#ddd;white-space:nowrap}
.tb:hover{background:var(--ui3)}.tb svg{width:17px;height:17px}
.tb.pri{background:var(--acc);color:#fff;font-weight:700;padding:0 16px}.tb.pri:hover{background:#b8242d}
.sep{width:1px;height:24px;background:var(--line);margin:0 6px}
#status{color:var(--mut);font-size:12px;margin-left:auto;margin-right:10px;white-space:nowrap}
.menu{position:relative}
.menu .dd{position:absolute;top:40px;left:0;background:var(--ui2);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:200px;display:none;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu.open .dd{display:block}
.dd button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:6px}
.dd button:hover{background:var(--ui3)}.dd svg{width:16px;height:16px}
.icongrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:250px}
.icongrid button{justify-content:center;padding:8px}
/* slides list */
#left{background:var(--ui);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#left .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:var(--mut)}
#thumbs{overflow:auto;padding:4px 12px 20px;flex:1}
.th{position:relative;margin-bottom:12px;cursor:pointer;display:grid;grid-template-columns:20px 1fr;gap:6px;align-items:start}
.th .n{color:var(--mut);font-size:11px;padding-top:4px;text-align:right}
.th .box{width:180px;height:101.25px;border-radius:6px;overflow:hidden;position:relative;outline:2px solid transparent;background:#000}
.th.on .box{outline-color:var(--acc2)}
.th .box>.slide{transform:scale(.09375);transform-origin:0 0;pointer-events:none}
.th.drag-over .box{outline-color:#fff;outline-style:dashed}
/* canvas */
#mid{position:relative;overflow:hidden;background:#0b0b0b}
#cwrap{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.slide{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;color:#fff;font-family:RobotoV,Roboto,Arial,sans-serif}
.slide .bg{position:absolute;inset:0;overflow:hidden}
.slide .bg .fog{position:absolute;inset:-20%;filter:blur(90px)}
.slide .bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide.grain::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;mix-blend-mode:overlay;z-index:9000;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.el{position:absolute;transform-origin:center center}
.el .tx{width:100%;height:100%;outline:none;white-space:pre-wrap;word-wrap:break-word}
.el .tx b,.el .tx strong{font-weight:800}
.el img.im{width:100%;height:100%;display:block}
.el svg.sh{width:100%;height:100%;display:block;overflow:visible}
.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.ic{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ic svg{width:52%;height:52%}
.srch{width:100%;height:100%;display:flex;align-items:center;gap:.6em;padding:0 1.1em;border-radius:999px;font-weight:300}
.srch svg{width:1em;height:1em;flex:none}.srch .cr{display:inline-block;width:2px;height:1.1em;background:#FF6B73;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flip{width:100%;height:100%;perspective:1800px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;padding:40px;display:flex;flex-direction:column;overflow:hidden}
.flip .fb{transform:rotateY(180deg)}
.flip .fa .t1{font-weight:800;font-size:110px;line-height:1;color:#FF6B73}.flip .fa .t2{margin-top:auto;font-size:40px;font-weight:300;line-height:1.15}
.flip .fb .q{font-size:30px;font-weight:300;line-height:1.4}.flip .fb .s{margin-top:auto;font-size:20px;opacity:.75}
.ph{color:rgba(255,255,255,.45)}
/* selection */
#sel{position:absolute;pointer-events:none;z-index:9500}
.selbox{position:absolute;border:2px solid #FF6B73;pointer-events:none}
.hdl{position:absolute;width:16px;height:16px;background:#fff;border:2px solid #D02D37;border-radius:4px;pointer-events:auto}
.hdl.rot{border-radius:50%;cursor:grab}
.guide{position:absolute;background:#2fd6ff;pointer-events:none;z-index:9600}
.el.locked{cursor:default}
.editing{outline:2px dashed #FF6B73;outline-offset:6px;cursor:text}
/* right panel */
#right{background:var(--ui);border-left:1px solid var(--line);overflow:auto;padding:14px 14px 40px}
#right h3{font-size:12px;color:var(--mut);font-weight:500;margin:16px 0 8px}
#right h3:first-child{margin-top:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row.three{grid-template-columns:1fr 1fr 1fr}
.row.one{grid-template-columns:1fr}
.fld{display:flex;flex-direction:column;gap:4px}
.fld span{font-size:11px;color:var(--mut)}
.fld input,.fld select,.fld textarea{background:var(--ui2);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;min-width:0}
.fld textarea{min-height:80px;resize:vertical;line-height:1.4}
.fld input[type=range]{padding:0}
.fld input[type=color]{height:32px;padding:2px}
.sw{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.sw button{width:22px;height:22px;border-radius:50%;border:1px solid #555}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.btns button{background:var(--ui2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:inline-flex;align-items:center;gap:6px}
.btns button:hover{background:var(--ui3)}
.btns button[aria-pressed=true]{background:var(--acc);border-color:var(--acc)}
.btns svg{width:15px;height:15px}
.hint{color:var(--mut);font-size:12px;line-height:1.5;margin-top:10px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0}
/* present */
#pres{position:fixed;inset:0;background:#000;z-index:100;display:none}
#pres.on{display:block}
#pstage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center}
#pstage .slide{transition:opacity .6s ease;opacity:0}
#pstage .slide.on{opacity:1}
#pbar{position:absolute;left:0;top:0;height:3px;background:#FF6B73;transition:width .4s;z-index:5}
#pui{position:absolute;right:16px;bottom:14px;display:flex;gap:6px;opacity:0;transition:opacity .3s;z-index:5}
#pres:hover #pui{opacity:1}
#pui button{background:rgba(0,0,0,.6);color:#fff;border-radius:30px;padding:8px 12px;display:flex;gap:6px;align-items:center;font-size:12px}
#pui svg{width:15px;height:15px}
#pnotes{position:absolute;left:16px;bottom:16px;width:520px;max-height:40vh;overflow:auto;background:rgba(20,20,20,.94);border:1px solid #333;border-radius:14px;padding:16px 18px;font-size:15px;line-height:1.5;display:none;z-index:6}
#pnotes.on{display:block}#pnotes b{color:#FF6B73;display:block;margin-bottom:4px;font-size:12px}
#pov{position:absolute;inset:0;background:rgba(0,0,0,.92);z-index:7;display:none;overflow:auto;padding:30px;grid-template-columns:repeat(4,1fr);gap:16px;align-content:start}
#pov.on{display:grid}
#pov button{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#111;text-align:left}
#pov button .slide{transform:scale(var(--k));transform-origin:0 0;pointer-events:none}
#pov button span{position:absolute;left:8px;bottom:6px;background:rgba(0,0,0,.7);padding:2px 8px;border-radius:10px;font-size:12px}
/* animations (present) */
.a-fade{animation:aFade .8s both}.a-up{animation:aUp .9s cubic-bezier(.2,.7,.2,1) both}.a-zoom{animation:aZoom .9s cubic-bezier(.2,.7,.2,1) both}.a-blur{animation:aBlur 1s both}.a-left{animation:aLeft .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes aFade{from{opacity:0}}@keyframes aUp{from{opacity:0;translate:0 50px}}@keyframes aZoom{from{opacity:0;scale:.92}}@keyframes aBlur{from{opacity:0;filter:blur(24px)}}@keyframes aLeft{from{opacity:0;translate:-60px 0}}
@media (prefers-reduced-motion:reduce){.a-fade,.a-up,.a-zoom,.a-blur,.a-left{animation:none}#pstage .slide{transition:none}.flip .in{transition:none}}

async function dbGet(k){ const db = await dbP; if(!db) return null; return new Promise(r => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); }); }
async function dbSet(k,v){ const db = await dbP; if(!db) return; return new Promise(r => { const t = db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete = r; t.onerror = r; }); }

let replaceImg = null;
function readImage(file, max=2000, jpg=false){ return new Promise(res => { const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const sc = Math.min(1, max/Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc); c.getContext('2d').drawImage(im,0,0,c.width,c.height); const png = !jpg && (file.type === 'image/png' || file.type === 'image/svg+xml'); res({ data: c.toDataURL(png?'image/png':'image/jpeg', jpg ? .72 : .86), w:c.width, h:c.height }); }; im.src = fr.result; }; fr.readAsDataURL(file); }); }
async function storeImage(file){
  if (ASSETS){ try { const r = await readImage(file); const blob = await (await fetch(r.data)).blob(); const up = await ASSETS.upload(blob); return { src: up.url, w: r.w, h: r.h }; } catch(e){ toast('No se pudo subir la imagen'); return null; } }
  const r = await readImage(file, shared ? 1400 : 2000, shared); if (shared && r.data.length > 450000){ toast('Imagen muy pesada para guardarla compartida'); return null; }
  if (shared) return { src: r.data, w: r.w, h: r.h };

}

    if (e.type === 'search'){ const st = $('.st', d); const full = e.p.text; let n = 0; if (reduce) st.textContent = full; else { const t = setTimeout(() => { const iv = setInterval(() => { st.textContent = full.slice(0, ++n); if (n >= full.length) clearInterval(iv); }, 55); typers.push(iv); }, 500); typers.push(t); } }

  if (['ArrowRight','PageDown',' ','Enter'].includes(ev.key)){ ev.preventDefault(); showP(pc+1); }
  else if (['ArrowLeft','PageUp','Backspace'].includes(ev.key)){ ev.preventDefault(); showP(pc-1); }
  else if (ev.key==='Home') showP(0); else if (ev.key==='End') showP(deck.slides.length-1);
  else if (ev.key==='n'||ev.key==='N') $('#pnotes').classList.toggle('on');
  else if (ev.key==='o'||ev.key==='O') toggleOv();
  else if (ev.key==='f'||ev.key==='F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  else if (ev.key==='Escape'){ if ($('#pov').classList.contains('on')) $('#pov').classList.remove('on'); else exitP(); } });
let tx0 = null; P.addEventListener('touchstart', e => tx0 = e.touches[0].clientX); P.addEventListener('touchend', e => { if (tx0 === null) return; const d = e.changedTouches[0].clientX - tx0; if (Math.abs(d) > 60) showP(pc + (d<0?1:-1)); tx0 = null; });
document.addEventListener('fullscreenchange', () => setTimeout(fitP, 50));

/* =================== inicio =================== */
function renderAll(){ renderThumbs(); renderCanvas(); renderPanel(); }
const gate = (title, text, btn) => { $('#gate').hidden = !title; if (!title) return; $('#gT').textContent = title; $('#gP').textContent = text; $('#gB').hidden = !btn; };
function startDeck(d){ deck = d; deck.assets = Object.assign({}, ASSETS0, deck.assets||{}); hist = [JSON.stringify(deck.slides)]; hIdx = 0; fitCanvas(); renderAll(); gate(); if (/presentar/.test(location.hash)) present(0); }
async function localMode(){
  shared = false; const seed = DEFAULT_DECK(); const stored = await dbGet('deck:'+seed.docId);
  startDeck(stored && stored.updated > 0 ? stored : seed); setStatus('Modo local: los cambios quedan solo en este navegador');
}
const FBV = 'https://www.gstatic.com/firebasejs/10.12.2/';
const ROOT = 'decks/compra-clara';
async function fireDB(cfg){
  const A = await import(FBV+'firebase-app.js'), F = await import(FBV+'firebase-firestore.js');
  const app = A.getApps().length ? A.getApp() : A.initializeApp(cfg); const fs = F.getFirestore(app);
  const mapP = p => p === 'deck/meta' ? ROOT : ROOT + '/' + p;
  const code = e => ({'permission-denied':'invalid_argument','resource-exhausted':'quota_exceeded','invalid-argument':'invalid_argument'}[e && e.code] || 'unavailable');
  const wrap = s => ({ id: s.id, exists: s.exists(), data: () => s.exists() ? JSON.parse(s.data().j) : undefined });
  return {
    doc: p => ({
      set: async d => { try { await F.setDoc(F.doc(fs, mapP(p)), { j: JSON.stringify(d), t: Date.now() }); } catch(e){ throw { code: code(e), message: String(e && e.message) }; } },
      get: async () => wrap(await F.getDoc(F.doc(fs, mapP(p)))),
      onSnapshot: (n, er) => F.onSnapshot(F.doc(fs, mapP(p)), s => n(wrap(s)), e => er && er({ code: code(e) })) }),
    collection: p => ({ onSnapshot: (n, er) => F.onSnapshot(F.collection(fs, mapP(p)), q => n({ docChanges: () => q.docChanges().map(c => ({ type: c.type, doc: wrap(c.doc) })) }), e => er && er({ code: code(e) })) })
  };
}
function parseCfg(txt){ const o = {}; txt.replace(/(\w+)\s*:\s*["']([^"']+)["']/g, (m,k,v) => { o[k] = v; }); return (o.apiKey && o.projectId) ? o : null; }
function setupMode(){
  gate('Conecta la base de datos compartida', 'Pega la configuración de tu proyecto de Firebase. Solo se hace una vez: luego descargas el archivo listo y lo publicas.', false);
  $('#setup').hidden = false; let ok = null;
  $('#cfgLocal').onclick = () => { $('#setup').hidden = true; localMode(); };
  $('#cfgTest').onclick = async () => {
    const cfg = parseCfg($('#cfgIn').value); const msg = $('#cfgMsg'); $('#cfgDl').hidden = true;
    if (!cfg){ msg.textContent = 'No encontré apiKey y projectId en lo que pegaste. Copia el bloque completo de firebaseConfig.'; return; }
    msg.textContent = 'Probando…';
    try { const d = await fireDB(cfg); await Promise.race([d.doc('deck/meta').get(), new Promise((_,r) => setTimeout(() => r({code:'timeout'}), 10000))]); ok = cfg; msg.textContent = 'Conexión correcta. Descarga el archivo y publícalo.'; $('#cfgDl').hidden = false; }
    catch(e){ msg.textContent = (e && e.code === 'permission-denied') ? 'Firebase responde, pero las reglas no permiten leer. Publica las reglas de la guía.' : 'No se pudo conectar. Revisa la configuración y que Firestore esté creado.'; }
  };
  $('#cfgDl').onclick = () => { const html = SRC.replace(/(<script id="fbcfg" type="application\/json">)[\s\S]*?(<\/script>)/, (m,a,b) => a + JSON.stringify(ok).replace(/</g,'\\u003c') + b); download('index.html', html, 'text/html'); };
}
(async () => {
  fitCanvas();
  const cfg = JSON.parse($('#fbcfg').textContent || 'null');
  if (!cfg) return setupMode();
  let db; try { db = await fireDB(cfg); } catch(e){ gate('No se pudo cargar Firebase', 'Revisa tu conexión a internet y vuelve a abrir la página.', false); return; }
  SDB = db; shared = true;
  let gotMeta = false, gotSlides = false, metaExists = false, started = false;
  const timer = setTimeout(() => { if (!started) gate('No se pudo conectar todavía', 'La versión compartida no responde. Revisa tu conexión; la página sigue intentándolo.', false); }, 10000);
  const ready = () => {
    if (!gotMeta || !gotSlides) return;
    clearTimeout(timer);
    if (!metaExists){ if (!started) gate('La presentación compartida está vacía', canWrite ? 'Cárgala una sola vez y todo el grupo verá y editará la misma versión.' : 'Quien tenga acceso de Editor debe cargarla primero.', canWrite); return; }
    if (!started){ started = true; applyRemote(); if (deck){ startDeck(deck); setStatus(canWrite ? 'Guardado · compartido con el grupo' : 'Solo lectura'); } }
    else applyRemote();
  };
  db.doc('deck/meta').onSnapshot(s => { gotMeta = true; metaExists = s.exists; if (s.exists){ const o = (s.data().order || []).slice(); order = o; orderSynced = JSON.stringify(o); } ready(); }, e => { clearTimeout(timer); if (!started) gate('Sin acceso a la base de datos', 'Firestore rechazó la lectura. Revisa que las reglas estén publicadas tal como dice la guía.', false); });
  db.collection('slides').onSnapshot(q => { gotSlides = true; q.docChanges().forEach(ch => { const id = ch.doc.id; if (ch.type === 'removed'){ delete remote[id]; delete synced[id]; return; } const b = JSON.stringify(ch.doc.data()); if (synced[id] !== b){ remote[id] = b; synced[id] = b; } }); ready(); }, e => { clearTimeout(timer); });
  $('#gB').onclick = async () => { $('#gB').hidden = true; $('#gP').textContent = 'Cargando las 21 láminas…'; deck = DEFAULT_DECK(); started = true; startDeck(deck); await flush(); };
})();
</script>
