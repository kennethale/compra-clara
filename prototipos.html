@font-face{font-family:Roboto;src:url('marca/roboto.woff');font-weight:100 900}*{box-sizing:border-box}body{margin:0;font:18px/1.45 Roboto,Arial,sans-serif;color:#332328;background:#f5f0f1}button,input{font:inherit}button{cursor:pointer;min-height:48px}button:focus-visible,input:focus-visible{outline:3px solid #a83338;outline-offset:4px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 5%;background:white;border-bottom:1px solid #e6dadd}header img{width:185px}header small{color:#8d6c76;font-size:12px;letter-spacing:.05em}nav{display:flex;justify-content:center;gap:10px;padding:20px 4%}nav button{background:transparent;color:#805663;border:1px solid #d8c3cb;border-radius:30px;padding:10px 22px;min-height:42px;font-size:14px}nav button[aria-pressed=true]{background:#a83338;color:white;border-color:#a83338}main{max-width:1080px;margin:auto;padding:20px 5% 35px}.top{display:flex;align-items:center;gap:13px;margin-bottom:22px}.number{display:grid;place-items:center;background:#a83338;color:#fff;width:38px;height:38px;border-radius:50%;font-size:16px;font-weight:700}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#976b7b}h1{font-size:clamp(32px,4vw,46px);line-height:1.08;letter-spacing:-1.4px;font-weight:350;margin:0 0 12px}h1 b{font-weight:800}p{margin:0 0 20px;color:#7c6570}.card{background:white;border:1px solid #e8dce1;border-radius:20px;padding:32px;box-shadow:0 18px 50px #68132e08}.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}.choice{border:2px solid #e9dde2;padding:22px;border-radius:13px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:background .18s,border-color .18s,transform .18s}.choice:hover{border-color:#d7abb9}.choice:has(input:checked){background:#fcf0f4;border-color:#a83338;transform:translateY(-2px)}input{accent-color:#a83338;width:19px;height:19px;margin:0;flex:none}.choice span{display:block}.choice strong{display:block;font-size:22px;line-height:1.2}.choice small{display:block;font-size:15px;color:#9b7f8a;margin-top:8px}.row{display:flex;align-items:center;gap:18px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}.primary{background:#a83338;color:white;border:0;border-radius:10px;padding:14px 24px;font-weight:700;transition:background .18s,transform .18s}.primary:hover{background:#872630}.primary:active{transform:scale(.98)}.primary:disabled{background:#d7bac4;cursor:not-allowed}.secondary{background:transparent;border:1px solid #d9bec8;color:#9b3a50;padding:13px 21px;border-radius:10px}.muted{color:#9b7b87;font-size:14px}.rule{border-top:1px solid #eee3e7;padding-top:18px;margin-top:22px;font-size:15px;color:#806570}.confirm{display:grid;grid-template-columns:70px 1fr;gap:25px;align-items:start;padding:22px 0}.check{display:grid;place-items:center;width:65px;height:65px;border-radius:50%;background:#f5e2e9;color:#a83338;font-size:36px;animation:pop .35s ease-out}.confirm h2{margin:0 0 12px;font-size:31px;letter-spacing:-.7px}.confirm p{margin:0;font-size:21px}.stamp{margin:25px 0 0;padding:20px 24px;background:#faf2f5;border-left:4px solid #a83338;border-radius:0 10px 10px 0;color:#82485d;font-size:17px}.compare{display:grid;grid-template-columns:1fr 48px 1fr;align-items:center;gap:15px}.datecard{padding:28px;background:#f6f2f3;border:1px solid #e9dfe3;border-radius:16px}.datecard.new{background:#f6e4eb;border-color:#e5c2cf}.datecard small{color:#986d7d;font-size:13px;font-weight:700;letter-spacing:.08em}.datecard strong{display:block;font-size:42px;line-height:1.1;margin:17px 0 7px;letter-spacing:-1.5px}.datecard span{font-size:17px;color:#7d5869}.arrow{text-align:center;font-size:31px;color:#a83338}.impact{margin:24px 0 0;padding:18px 22px;background:#fcf5f7;border-radius:12px}.impact strong{display:block;font-size:20px;margin-bottom:7px}.impact p{margin:0;font-size:17px}.timeline{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;position:relative;margin:32px 0 22px}.timeline:before{content:'';position:absolute;top:19px;left:30px;right:30px;height:2px;background:#eadbe2}.event{position:relative}.dot{display:grid;place-items:center;background:#f0e6eb;color:#a88b97;width:40px;height:40px;border-radius:50%;font-size:16px;font-weight:800;margin-bottom:20px;transition:background .25s,color .25s}.event.done .dot{background:#a83338;color:white;animation:pop .3s ease-out}.event h3{font-size:21px;line-height:1.2;margin:0 0 10px}.event p{font-size:16px;max-width:230px}.status{padding:14px 20px;background:#f9edf2;border-radius:10px;font-size:19px;color:#8d334f;font-weight:650}.demo-controls{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:24px;border-top:1px dashed #dfcbd4;padding-top:18px}.demo-controls small{font-size:13px;color:#a18491}.footer{max-width:1080px;margin:auto;padding:0 5% 25px;display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:12px;color:#a18491}.link{background:none;border:0;padding:5px;color:#a33c53;text-decoration:underline;text-underline-offset:4px;font-size:14px}.animate{animation:reveal .28s ease-out}.live{font-size:14px;color:#93405b;min-height:20px;margin-top:12px}@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:.3;transform:scale(.8)}to{opacity:1;transform:scale(1)}}body.embed nav{display:none}body.embed header{padding:14px 4%;height:58px}body.embed header img{width:150px}body.embed main{max-width:1240px;padding:20px 4% 10px}body.embed .top{margin-bottom:12px}body.embed h1{font-size:36px}body.embed .card{padding:25px 30px}body.embed .footer{max-width:1240px;padding:0 4% 12px}body.embed .datecard{padding:22px}body.embed .timeline{margin-top:20px}body.embed .rule{margin-top:15px;padding-top:15px}@media(max-width:650px){header{padding:18px 6%}header img{width:145px}header small{max-width:140px;text-align:right}nav{flex-wrap:wrap;gap:6px}nav button{padding:8px 12px;font-size:12px}.choices{grid-template-columns:1fr}.choice{padding:18px}.card{padding:22px}main{padding:18px 6% 25px}.compare{gap:6px;grid-template-columns:1fr 25px 1fr}.datecard{padding:18px}.datecard strong{font-size:29px}.datecard span{font-size:14px}.arrow{font-size:23px}.timeline{gap:12px}.event h3{font-size:17px}.event p{font-size:14px}.demo-controls{align-items:flex-start;flex-direction:column}.footer{padding:0 6% 20px}body.embed .choice strong{font-size:19px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media(min-width:900px){body.embed main{display:grid;grid-template-columns:290px minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:30px;padding-top:18px;padding-bottom:8px}body.embed .top{grid-column:1;grid-row:1;margin-top:14px}body.embed h1{grid-column:1;grid-row:2;font-size:36px}body.embed main>p{grid-column:1;grid-row:3;font-size:17px;margin-top:8px}body.embed .card{grid-column:2;grid-row:1 / 4;padding:20px 24px;align-self:start}body.embed .datecard{padding:18px}body.embed .datecard strong{font-size:36px;margin-top:10px}body.embed .impact{margin-top:16px;padding:14px 18px}body.embed .impact p{font-size:15px}body.embed .row{margin-top:16px}body.embed .choices{margin-top:8px}body.embed .choice{padding:18px 14px}body.embed .choice strong{font-size:21px}body.embed .timeline{gap:15px;margin:18px 0 10px}body.embed .dot{margin-bottom:10px}body.embed .event h3{font-size:19px}body.embed .event p{font-size:14px;margin-bottom:5px}body.embed .status{font-size:17px}body.embed .demo-controls{margin-top:14px;padding-top:12px}body.embed .demo-controls button{font-size:15px}body.embed .rule{font-size:13px;margin-top:12px;padding-top:10px}body.embed .live{min-height:0;margin-top:0}body.embed .footer{padding-top:7px}}
</style></head><body><header><img src="marca/siman-com-logotipo-tinta.svg" alt="siman.com"><small>Prototipo académico · datos ficticios</small></header><nav aria-label="Probar las soluciones"><button data-scene="contact">1 · No pude contestar</button><button data-scene="changes">2 · Mi entrega cambió</button><button data-scene="receipt">3 · Pedí cancelar</button></nav><main id="main"></main><footer class="footer"><span>Demostración: no contacta a SIMAN ni modifica pedidos reales.</span><button class="link" id="reset">Volver a probar</button></footer><script>
'use strict';const $=s=>document.querySelector(s);const q=new URLSearchParams(location.search);if(q.get('embed')==='1')document.body.classList.add('embed');let scene=['contact','changes','receipt'].includes(q.get('scene'))?q.get('scene'):'contact',slot='',done=false,choice='',confirmed=false;const labels={contact:['1','No pude contestar','Elijo cuándo<br><b>retomar el contacto.</b>','Selecciona una franja de ejemplo y confirma tu elección.'],changes:['2','Mi entrega cambió','Veo la diferencia.<br><b>Decido qué necesito.</b>','Las dos fechas son ficticias y sirven para probar la propuesta.'],receipt:['3','Pedí cancelar','¿Está pendiente<br><b>o ya se confirmó?</b>','El estado muestra la diferencia entre pedir una gestión y completarla.']};
function contact(){if(done)return `<div class="confirm"><div class="check" aria-hidden="true">✓</div><div><h2>Elegiste ${slot.toLowerCase()}.</h2><p>Ya sabes cuándo solicitaste retomar el contacto.</p></div></div><div class="stamp">La validación de la compra sigue pendiente.</div><div class="row"><button class="secondary" data-action="edit">Cambiar mi elección</button><span class="muted">No se reserva una llamada real.</span></div>`;return `<div class="choices"><label class="choice"><input type="radio" name="slot" value="Mañana de 9:00 a 11:00" ${slot.includes('9:00')?'checked':''}><span><strong>Por la mañana</strong><small>Mañana · 9:00–11:00</small></span></label><label class="choice"><input type="radio" name="slot" value="Mañana de 14:00 a 16:00" ${slot.includes('14:00')?'checked':''}><span><strong>Por la tarde</strong><small>Mañana · 14:00–16:00</small></span></label></div><div class="row"><button class="primary" data-action="contact" ${!slot?'disabled':''}>Solicitar esta franja →</button><span class="muted">Horarios de ejemplo</span></div><div class="rule">Elegir un horario no valida ni aprueba la compra.</div>`}
function changes(){if(done)return `<div class="confirm"><div class="check" aria-hidden="true">✓</div><div><h2>${choice==='other'?'Pediste revisar otra opción.':'Viste la nueva estimación.'}</h2><p>${choice==='other'?'La consulta conserva el contexto del cambio.':'Tu preferencia queda registrada en esta demostración.'}</p></div></div><div class="stamp">${choice==='other'?'Revisión pendiente. No se ha confirmado una alternativa.':'La elección no modifica por sí sola una entrega.'}</div><div class="row"><button class="secondary" data-action="edit">Ver el cambio otra vez</button></div>`;return `<div class="compare"><div class="datecard"><small>ANTES</small><strong>Martes 24</strong><span>Estimación anterior</span></div><div class="arrow" aria-hidden="true">→</div><div class="datecard new"><small>AHORA</small><strong>Jueves 26</strong><span>Nueva estimación</span></div></div><div class="impact"><strong>La entrega se desplaza dos días.</strong><p>La actualización debe explicar el motivo confirmado y las opciones que apliquen al pedido.</p></div><div class="row"><button class="primary" data-action="other">Necesito otra opción</button><button class="secondary" data-action="wait">Puedo esperar</button></div>`}
function receipt(){return `<div class="status" role="status">${confirmed?'Ejemplo: cancelación confirmada':'Tu solicitud está recibida; la cancelación sigue pendiente.'}</div><div class="timeline"><div class="event done"><div class="dot">✓</div><h3>Pediste cancelar</h3><p>La solicitud quedó registrada.</p></div><div class="event ${confirmed?'done':''}"><div class="dot">${confirmed?'✓':'2'}</div><h3>${confirmed?'Se revisó':'Falta revisar'}</h3><p>${confirmed?'Se completó la revisión en este ejemplo.':'Se comprueba si puede ejecutarse.'}</p></div><div class="event ${confirmed?'done':''}"><div class="dot">${confirmed?'✓':'3'}</div><h3>${confirmed?'Se confirmó':'Falta confirmar'}</h3><p>${confirmed?'Cancelación confirmada en la simulación.':'Todavía no hay una cancelación confirmada.'}</p></div></div><div class="row"><button class="primary" data-action="download">Guardar comprobante de ejemplo ↓</button><span class="muted">Referencia ficticia: MUESTRA-01</span></div><div class="demo-controls"><small>Control para demostrar el cambio de estado</small><button class="secondary" data-action="simulate">${confirmed?'Volver al estado pendiente':'Ver qué pasa al confirmarse'}</button></div><div class="rule">${confirmed?'Una cancelación confirmada no significa que el dinero ya esté abonado.':'Solicitud recibida no significa cancelación confirmada.'}</div><div class="live" aria-live="polite"></div>`}
function render(focus=false){let l=labels[scene];document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));$('#main').innerHTML=`<div class="top"><span class="number">${l[0]}</span><span class="eyebrow">${l[1]}</span></div><h1 tabindex="-1">${l[2]}</h1><p>${l[3]}</p><section class="card animate" aria-label="Prototipo interactivo">${scene==='contact'?contact():scene==='changes'?changes():receipt()}</section>`;if(focus)$('h1').focus({preventScroll:true})}
function reset(){slot='';done=false;choice='';confirmed=false;render(true)}
document.addEventListener('change',e=>{if(e.target.name==='slot'){slot=e.target.value;$('[data-action="contact"]').disabled=false}});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.scene){scene=b.dataset.scene;reset();return}if(b.id==='reset'){reset();return}let a=b.dataset.action;if(a==='contact'&&slot){done=true;render(true)}if(a==='edit'){done=false;render(true)}if(a==='other'||a==='wait'){choice=a;done=true;render(true)}if(a==='simulate'){confirmed=!confirmed;render(true)}if(a==='download'){let text=`COMPRA CLARA · EJEMPLO ACADÉMICO\nNo es un documento oficial de SIMAN.\nReferencia ficticia: MUESTRA-01\nSolicitaste: cancelar el pedido de ejemplo\nSituación: ${confirmed?'cancelación confirmada en simulación':'solicitud recibida; revisión pendiente'}\nDinero: sin abono confirmado\nNo modifica pedidos ni demuestra una gestión real.`;let u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),link=document.createElement('a');link.href=u;link.download='Compra_Clara_Comprobante_EJEMPLO.txt';link.click();setTimeout(()=>URL.revokeObjectURL(u),3000);$('.live').textContent='Comprobante ficticio preparado para guardar.'}});render();
</script></body></html>
