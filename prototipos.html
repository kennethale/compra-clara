@font-face{font-family:Roboto;src:url('marca/roboto.woff');font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:#f5f1f1;color:#33262a;font-family:Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #a83338;outline-offset:4px}button:disabled{opacity:.4;cursor:not-allowed}button{min-height:44px}header{height:78px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #e6dcdf;gap:20px}header img{width:190px}header span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7a666d}.lab{background:#281218;color:#f9edef;padding:12px 5%;display:flex;gap:18px;align-items:center;justify-content:space-between;font-size:13px}.lab b{font-weight:600}.scene-nav{display:flex;gap:6px}.scene-nav button{border:1px solid #78515e;color:white;background:none;padding:8px 14px;border-radius:6px;min-height:36px}.scene-nav button[aria-pressed=true]{background:#a83338;border-color:#a83338}.layout{max-width:1240px;margin:auto;padding:35px 5%;display:grid;grid-template-columns:minmax(220px,.8fr) minmax(420px,1.5fr);gap:45px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#a83338;font-weight:750;text-transform:uppercase}h1{font-size:clamp(27px,3.4vw,45px);line-height:1.05;letter-spacing:-1.2px;font-weight:350;margin:18px 0}h1 strong{font-weight:800}h2{font-size:25px;line-height:1.2;margin:0 0 12px;letter-spacing:-.4px}h3{font-size:17px;margin:0 0 6px}p{margin:0 0 16px}.muted{color:#786a70}.context{font-size:15px;max-width:320px}.summary{margin-top:25px;padding-top:20px;border-top:1px solid #ded2d6}.summary div{display:flex;justify-content:space-between;padding:8px 0;font-size:13px}.tag{display:inline-flex;gap:7px;align-items:center;border-radius:30px;background:#f8e8ed;color:#922b40;padding:6px 12px;font-size:12px;font-weight:700}.tag:before{content:'';height:6px;width:6px;background:currentColor;border-radius:50%}.panel{background:#fff;border:1px solid #e7dde1;border-radius:18px;padding:30px;box-shadow:0 15px 35px #4f172808;min-width:0}.progress{display:flex;align-items:center;gap:10px;margin:0 0 26px;font-size:12px;color:#8f7d84}.progress i{width:30px;height:2px;background:#e4d8dd}.progress .on{font-weight:700;color:#a83338}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.option{position:relative;display:block;border:1.5px solid #e7dce1;border-radius:12px;padding:17px;cursor:pointer;transition:border-color .15s,background .15s;min-height:94px}.option:has(input:checked){background:#fcf0f3;border-color:#a83338}.option input{accent-color:#a83338;margin:0 8px 8px 0;vertical-align:middle;width:17px;height:17px}.option strong{font-size:16px}.option small{display:block;color:#807078;font-size:13px;margin:7px 0 0 28px}.actions{display:flex;align-items:center;gap:16px;margin-top:22px;flex-wrap:wrap}.primary{background:#a83338;color:#fff;border:0;border-radius:8px;padding:13px 21px;font-weight:650;transition:background .15s,transform .15s}.primary:hover{background:#85232d}.primary:active{transform:translateY(1px)}.secondary{background:#fff;border:1px solid #d8c8cf;color:#683c4b;border-radius:8px;padding:12px 18px}.link{background:none;border:none;padding:6px 0;color:#9d3043;text-decoration:underline;text-underline-offset:4px}.notice{background:#f8f4f5;border-left:3px solid #d9b7c3;padding:14px 16px;font-size:13px;margin-top:20px;color:#6f5962}.success-icon{width:55px;height:55px;border-radius:50%;background:#f7e4eb;color:#a83338;display:grid;place-items:center;font-size:31px;margin-bottom:20px}.receipt{border:1px solid #e5d8de;border-radius:12px;overflow:hidden;margin-top:22px}.receipt .row{display:flex;justify-content:space-between;gap:20px;padding:13px 18px;font-size:14px;border-bottom:1px solid #f1e9ec}.receipt .row:last-child{border:0}.receipt .row span{color:#806c75}.receipt b{font-weight:650}.info-title{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.compare{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e4d8df;border-radius:12px;overflow:hidden;margin:20px 0}.compare>div{padding:22px;background:#f8f5f6}.compare>div+div{background:#f8e6ed;border-left:1px solid #e5cdd6}.compare small{font-size:11px;letter-spacing:.08em;color:#8d6473}.date{font-size:29px;font-weight:800;display:block;margin:13px 0 5px;letter-spacing:-.8px}.reason{margin:20px 0}.reason summary{cursor:pointer;color:#963046;font-weight:650;min-height:44px;padding:10px 0}.reason p{font-size:14px;color:#78606b;padding:5px 0 5px 14px;border-left:2px solid #e6c7d2}.choice{display:flex;align-items:flex-start;gap:12px;padding:16px;border:1px solid #e5d8df;border-radius:10px;margin:12px 0;cursor:pointer}.choice input{accent-color:#a83338;margin-top:6px;flex:none}.choice:has(input:checked){border-color:#a83338;background:#fff7f9}.choice small{display:block;color:#83707a;margin-top:5px;font-size:13px}.tabs{display:flex;gap:18px;border-bottom:1px solid #eadde3;margin:20px 0}.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 0;color:#8e7581}.tabs button[aria-selected=true]{border-color:#a83338;color:#a83338;font-weight:700}.track{list-style:none;margin:25px 0;padding:0}.track li{position:relative;padding:0 0 27px 38px}.track li:before{content:'';position:absolute;left:7px;top:5px;width:12px;height:12px;border-radius:50%;background:#e2d5dc}.track li:not(:last-child):after{content:'';position:absolute;left:12px;top:20px;bottom:2px;width:2px;background:#e9dce3}.track .done:before{background:#a83338;box-shadow:0 0 0 4px #f8e8ee}.track small{display:block;color:#8d7580;margin-top:5px}.ref{font-size:30px;letter-spacing:2px;font-weight:800;color:#7c2d45}.simulation{border-top:1px dashed #ddcbd4;margin-top:25px;padding-top:16px;font-size:12px;color:#8b7781}.simulation button{font-size:12px;margin:9px 7px 0 0;min-height:35px;padding:7px 12px}.footer{max-width:1240px;margin:auto;padding:5px 5% 20px;display:flex;justify-content:space-between;gap:20px;font-size:11px;color:#917c86}.footer button{font-size:12px;min-height:30px}.announce{min-height:25px;margin-top:15px;font-size:14px;color:#913147;font-weight:600}.reveal{animation:reveal .25s ease-out}@keyframes reveal{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}.hide{display:none}.context .mini{width:46px;height:4px;background:#a83338;margin:25px 0}body.embed .lab{padding:9px 4%;font-size:11px}body.embed header{height:66px;padding:0 4%}body.embed header img{width:164px}body.embed .layout{padding:24px 4%;gap:30px}body.embed .panel{padding:24px}body.embed h1{font-size:36px}body.embed .scene-nav button{font-size:11px;padding:5px 10px;min-height:28px}body.embed .footer{padding:0 4% 12px}a{color:#963046}body.embed .layout{display:block;max-width:1100px}body.embed .context{display:none}body.embed .options{grid-template-columns:repeat(3,1fr)}body.embed .option{min-height:80px;padding:14px}body.embed .panel h2{font-size:30px}body.embed .layout{padding-top:18px;padding-bottom:18px}@media(max-width:760px){.layout{grid-template-columns:1fr;gap:20px;padding:24px}.context{max-width:none}.summary{display:none}.context p{font-size:14px}.context h1{font-size:29px}.context .mini{display:none}.panel{padding:24px}.lab{align-items:flex-start;flex-direction:column;gap:10px}.scene-nav{flex-wrap:wrap}header{height:66px;padding:0 24px}header img{width:160px}.options{gap:8px}.option{padding:12px}.footer{padding:0 24px 20px}.info-title{align-items:flex-start}body.embed .context{display:none}body.embed .layout{display:block;padding:14px 4%}body.embed .panel{padding:20px}.date{font-size:25px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="lab"><b>Compra Clara · Laboratorio de interacción</b><nav class="scene-nav" aria-label="Escenarios"><button data-scene="contact">01 Contacto</button><button data-scene="changes">02 Cambios</button><button data-scene="receipt">03 Gestión</button></nav></div><header><img src="marca/siman-com-logotipo-tinta.svg" alt="siman.com"><span>Concepto académico · no es una web oficial</span></header><main id="main" class="layout"></main><footer class="footer"><span>Datos ficticios. Este prototipo no contacta a SIMAN ni modifica pedidos.</span><button class="link" id="reset">Reiniciar demostración</button></footer><script>
'use strict';const $=s=>document.querySelector(s);const p=new URLSearchParams(location.search);if(p.get('embed')==='1')document.body.classList.add('embed');const valid=['contact','changes','receipt'];let scene=valid.includes(p.get('scene'))?p.get('scene'):'contact';let step=0;let slot='';let response='';let confirmed=false;let tab='actual';let contactMode='';const view=p.get('view');if(view==='slots')step=1;if(view==='response')step=1;if(view==='handoff')tab='summary';
const options=['Mañana · 9:00–11:00','Mañana · 14:00–16:00','Pasado mañana · 10:00–12:00'];
const context={contact:['01 · Contacto recuperable','Una llamada perdida.<br><strong>Una oportunidad de retomarla.</strong>','La persona conoce qué está pendiente,elige cómo retomar el contacto y recibe una confirmación de su elección.'],changes:['02 · Cambios explicados','Qué cambió.<br><strong>Qué significa para ti.</strong>','Una actualización compara la información anterior y la actual antes de pedir una decisión.'],receipt:['03 · Comprobante de gestión','Lo solicitado.<br><strong>Lo confirmado.</strong>','Una referencia conserva el contexto y permite distinguir una solicitud recibida de una gestión ejecutada.']};
function sidebar(){let c=context[scene];return `<aside class="context"><span class="eyebrow">${c[0]}</span><h1>${c[1]}</h1><div class="mini"></div><p class="muted">${c[2]}</p><div class="summary"><div><span>Pedido de ejemplo</span><b>CC-DEMO-01</b></div><div><span>Modo</span><b>Simulación local</b></div></div></aside>`}
function progress(a,b){return `<div class="progress"><span class="${step===0?'on':''}">${a}</span><i></i><span class="${step>0?'on':''}">${b}</span></div>`}
function contact(){if(step===2)return `<div class="success-icon" aria-hidden="true">✓</div><span class="eyebrow">Elección registrada en esta demostración</span><h2>Ya sabes cómo continuará el contacto.</h2><p class="muted">Conserva el resumen de lo que acabas de seleccionar.</p><div class="receipt"><div class="row"><span>Referencia de ejemplo</span><b>CC-DEMO-01</b></div><div class="row"><span>Modalidad</span><b>${contactMode==='email'?'Solicitar contacto por correo':'Retomar llamada'}</b></div>${contactMode==='email'?'':`<div class="row"><span>Franja de ejemplo</span><b>${slot}</b></div>`}<div class="row"><span>Validación de compra</span><b>Pendiente</b></div></div><div class="notice">Elegir una franja no valida ni aprueba la compra. La disponibilidad real debe confirmarse antes de implementar esta interacción.</div><div class="actions"><button class="secondary" data-action="editcontact">Cambiar mi elección</button></div>`;
if(step===0)return `${progress('Situación','Tu elección')}<span class="tag">Requiere tu atención</span><h2 style="margin-top:20px">No pudimos completar una validación.</h2><p class="muted">Queremos retomar el contacto contigo. Elige una alternativa para continuar.</p><label class="choice"><input type="radio" name="mode" value="call" ${contactMode==='call'?'checked':''}><span><strong>Elegir una franja de llamada</strong><small>Consulta horarios de ejemplo y selecciona cuándo puedes atender.</small></span></label><label class="choice"><input type="radio" name="mode" value="email" ${contactMode==='email'?'checked':''}><span><strong>Solicitar contacto por correo</strong><small>Alternativa conceptual,condicionada a las reglas de validación.</small></span></label><div class="actions"><button class="primary" data-action="contactnext" ${!contactMode?'disabled':''}>Continuar →</button></div><div class="notice">No solicitamos contraseñas,códigos de verificación ni datos de tarjeta.</div>`;
return `${progress('Contacto','Selecciona una franja')}<span class="eyebrow">Horarios ficticios para probar la interacción</span><h2 style="margin-top:14px">¿Cuándo puedes atender?</h2><p class="muted">Selecciona una opción. Podrás revisarla antes de continuar.</p><div class="options">${options.map((o,i)=>`<label class="option"><input type="radio" name="slot" value="${i}" ${slot===o?'checked':''}><strong>${o.split(' · ')[0]}</strong><small>${o.split(' · ')[1]}</small></label>`).join('')}</div><div class="actions"><button class="primary" data-action="confirmcontact" ${!slot?'disabled':''}>Confirmar mi elección</button><button class="link" data-action="backcontact">Volver</button></div><div class="notice">La selección es una simulación. No se reserva una llamada real.</div>`}
function changes(){if(step===2)return `<div class="success-icon" aria-hidden="true">✓</div><span class="eyebrow">Preferencia registrada en esta demostración</span><h2>${response==='wait'?'Viste la nueva estimación.':'Solicitaste revisar otra alternativa.'}</h2><div class="receipt"><div class="row"><span>Tu elección</span><b>${response==='wait'?'Puedo esperar':'Necesito otra alternativa'}</b></div><div class="row"><span>Estado de gestión</span><b>${response==='wait'?'Preferencia registrada':'Revisión pendiente'}</b></div></div><div class="notice">Esta elección no reprograma una entrega ni confirma una cancelación. Las opciones dependen de la operación real.</div><div class="actions"><button class="secondary" data-action="editchange">Cambiar mi elección</button></div>`;
const diff=`<div class="compare"><div><small>ESTIMACIÓN ANTERIOR</small><span class="date">Martes 24</span><span>Noviembre · fecha ficticia</span></div><div><small>ESTIMACIÓN ACTUAL</small><span class="date">Jueves 26</span><span>Noviembre · fecha ficticia</span></div></div>`;
if(step===0)return `<div class="info-title"><span class="tag">Cambio en la entrega</span><span class="eyebrow">CC-DEMO-01</span></div><h2>La estimación de entrega cambió.</h2><p class="muted">Compara las dos versiones para entender cómo te afecta.</p>${diff}<details class="reason"><summary>¿Qué debe explicar esta actualización?</summary><p>El motivo confirmado,el impacto y el siguiente paso. Este ejemplo no atribuye una causa real a SIMAN.</p></details><div class="actions"><button class="primary" data-action="changenext">Ver mis opciones →</button></div>`;
return `${progress('Cambio de entrega','Tu decisión')}<h2>¿Cómo quieres continuar?</h2><p class="muted">Opciones de ejemplo,sujetas a validación para cada pedido.</p><label class="choice"><input type="radio" name="response" value="wait" ${response==='wait'?'checked':''}><span><strong>Puedo esperar la nueva estimación</strong><small>Registrar que vi la actualización.</small></span></label><label class="choice"><input type="radio" name="response" value="review" ${response==='review'?'checked':''}><span><strong>Necesito revisar otra alternativa</strong><small>Solicitar orientación conservando el contexto del cambio.</small></span></label><div class="actions"><button class="primary" data-action="confirmchange" ${!response?'disabled':''}>Registrar mi elección</button><button class="link" data-action="backchange">Comparar de nuevo</button></div><div class="notice">Una preferencia no equivale a una gestión ya ejecutada.</div>`}
function receipt(){return `<div class="info-title"><span class="tag">${confirmed?'Cancelación confirmada · simulación':'Solicitud recibida'}</span><span class="eyebrow">Caso de ejemplo</span></div><h2>Tu solicitud de cancelación</h2><div class="tabs" role="tablist" aria-label="Vista de la gestión"><button role="tab" aria-selected="${tab==='actual'}" data-tab="actual">Estado</button><button role="tab" aria-selected="${tab==='history'}" data-tab="history">Historial</button><button role="tab" aria-selected="${tab==='summary'}" data-tab="summary">Comprobante</button></div><div role="tabpanel">${tab==='actual'?`<ul class="track"><li class="done"><h3>Solicitud recibida</h3><small>Se registró la intención del comprador.</small></li><li class="${confirmed?'done':''}"><h3>${confirmed?'Revisión completada':'Revisión pendiente'}</h3><small>${confirmed?'Se completó el paso en esta simulación.':'Debe comprobarse si la solicitud puede ejecutarse.'}</small></li><li class="${confirmed?'done':''}"><h3>${confirmed?'Cancelación confirmada':'Cancelación no confirmada'}</h3><small>${confirmed?'Ejemplo de una gestión confirmada por su fuente.':'No interpretes la recepción de la solicitud como una cancelación.'}</small></li></ul><div class="notice">${confirmed?'Cancelación confirmada no significa dinero abonado. Cualquier devolución requiere su propio estado.':'Tu solicitud está recibida. No hay una cancelación confirmada en este escenario.'}</div>`:tab==='history'?`<div class="receipt"><div class="row"><span>Evento 1 · ejemplo</span><b>Solicitud registrada</b></div>${confirmed?'<div class="row"><span>Evento 2 · ejemplo</span><b>Revisión completada</b></div><div class="row"><span>Evento 3 · ejemplo</span><b>Cancelación confirmada</b></div>':'<div class="row"><span>Próximo evento</span><b>Pendiente de confirmación</b></div>'}</div><p class="muted" style="margin-top:20px">Cada cambio debe conservar una referencia y provenir de una fuente validada.</p>`:`<span class="eyebrow">Referencia ficticia</span><p class="ref">MUESTRA-01</p><div class="receipt"><div class="row"><span>Solicitaste</span><b>Cancelar el pedido de ejemplo</b></div><div class="row"><span>Situación</span><b>${confirmed?'Cancelación confirmada':'Revisión pendiente'}</b></div><div class="row"><span>Dinero</span><b>Sin abono confirmado en esta demo</b></div></div><div class="actions"><button class="primary" data-action="download">Descargar comprobante de ejemplo</button><button class="link" data-action="copy">Copiar referencia</button></div>`}</div><div class="simulation"><b>Control de demostración · no modifica pedidos</b><br><button class="secondary" data-action="simulate">${confirmed?'Volver a revisión pendiente':'Simular confirmación de cancelación'}</button></div>`}
function render(focus=false){document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));$('#main').innerHTML=sidebar()+`<section class="panel reveal" aria-label="Prototipo de ${scene==='contact'?'contacto':scene==='changes'?'cambios':'gestión'}">${scene==='contact'?contact():scene==='changes'?changes():receipt()}<div class="announce" role="status" aria-live="polite"></div></section>`;if(focus){const h=$('.panel h2');h.tabIndex=-1;h.focus({preventScroll:true});}}
function reset(){step=0;slot='';response='';confirmed=false;tab='actual';contactMode='';render(true)}
document.addEventListener('change',e=>{if(e.target.name==='mode'){contactMode=e.target.value;const b=$('[data-action="contactnext"]');b.disabled=false;}if(e.target.name==='slot'){slot=options[Number(e.target.value)];$('[data-action="confirmcontact"]').disabled=false;}if(e.target.name==='response'){response=e.target.value;$('[data-action="confirmchange"]').disabled=false;}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.scene){scene=b.dataset.scene;reset();return}if(b.id==='reset'){reset();return}if(b.dataset.tab){tab=b.dataset.tab;render();$(`[data-tab="${tab}"]`).focus();return}const a=b.dataset.action;if(a==='contactnext'){step=contactMode==='email'?2:1;render(true)}if(a==='backcontact'){step=0;render(true)}if(a==='confirmcontact'&&slot){step=2;render(true)}if(a==='editcontact'){step=contactMode==='email'?0:1;render(true)}if(a==='changenext'||a==='editchange'){step=1;render(true)}if(a==='backchange'){step=0;render(true)}if(a==='confirmchange'&&response){step=2;render(true)}if(a==='simulate'){confirmed=!confirmed;render(true)}if(a==='copy'){try{await navigator.clipboard.writeText('MUESTRA-01');$('.announce').textContent='Referencia de ejemplo copiada.'}catch{$('.announce').textContent='Referencia para copiar:MUESTRA-01'}}if(a==='download'){const txt=`COMPRA CLARA · COMPROBANTE DE EJEMPLO\nNo es un documento de SIMAN.\nReferencia:MUESTRA-01\nSolicitud:cancelar el pedido ficticio\nEstado:${confirmed?'Cancelación confirmada en simulación':'Revisión pendiente'}\nDinero:sin abono confirmado en esta demo\nNo modifica pedidos ni demuestra una gestión real.`;const u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));const link=document.createElement('a');link.href=u;link.download='Compra_Clara_Comprobante_DEMO.txt';link.click();setTimeout(()=>URL.revokeObjectURL(u),3000);$('.announce').textContent='Se descargó el comprobante ficticio.'}});render();
</script></body></html>
